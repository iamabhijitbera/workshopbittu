<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management - My Workshop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
             <div class="sidebar-header">
                <img src="images/logo.webp" alt="Logo" class="logo">
                <h2 id="">Bholanath Workshop</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Home</a></li>
                <li class="active"><a href="stock.html">Stock Management</a></li>
                <li><a href="stock-data.html">Stock Report</a></li>
                <li><a href="billing.html">Create Invoice</a></li>
                <li><a href="invoices.html">Invoices</a></li>
                <li id="employee-link" style="display:none;"><a href="employees.html">Employees</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
        <div class="main-content">
            <header>
                <h1>Stock Management</h1>
            </header>
            <main>
                <div class="card" id="stock-form-card">
                    <h2 id="stock-form-title">Add New Stock</h2>
                    <form id="add-stock-form">
                        <input type="hidden" id="stock-id">
                        <div class="form-grid">
                            <input type="text" id="item-name" placeholder="Item Name" required>
                            <input type="text" id="item-number" placeholder="Item Number/Code">
                            <textarea id="item-description" placeholder="Description"></textarea>
                            <input type="date" id="purchase-date" required>
                            <input type="number" id="purchase-price" placeholder="Purchase Price (INR)" step="0.01" required>
                            <input type="number" id="quantity" placeholder="Quantity" required>
                            <input type="number" id="gst-percent" placeholder="GST % on Purchase" required>
                            <input type="number" id="selling-price" placeholder="Selling Price" step="0.01">
                        </div>
                        <button type="submit" id="stock-submit-btn">Add Stock</button>
                        <button type="button" id="stock-cancel-btn" class="secondary-btn" style="display: none;">Cancel Edit</button>
                    </form>
                </div>
                <div class="card">
                    <h2>Current Stock</h2>
                    <input type="text" id="stock-search" placeholder="Search stock by name or code...">
                    <table id="stock-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Item Code</th>
                                <th>In Stock</th>
                                <th>Purchase Price</th>
                                <th>Selling Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Stock data will be loaded here -->
                        </tbody>
                    </table>
                    <div class="pagination" id="stock-pagination">
                        <button id="prev-page-stock"><i class="fas fa-chevron-left"></i></button>
                        <span id="page-info-stock">Page 1</span>
                        <button id="next-page-stock"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
